name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

jobs:
  basic-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt || echo "No requirements"

      - name: Run basic check
        run: echo "CI pipeline OK"
