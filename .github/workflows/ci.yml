name: CI Pipeline

on:
  pull_request:
  push:
    branches:
      - develop
      - feature/**
      - hotfix/**

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements_dev.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Format check (black)
        run: black --check .

      - name: Security scan (Bandit)
        run: bandit -c .bandit -r .

      - name: Dependency security audit
        run: pip-audit

      - name: Run tests
        run: pytest -q || echo "No tests found"

      - name: Validate SQL schema
        run: |
          if [ -f data/sql/create_tables.sql ]; then
            echo "SQL schema found"
          else
            echo "Missing SQL schema" && exit 1
          fi

      - name: Validate Streamlit build
        run: python -m py_compile api/streamlit/*.py
