# =============================================================================
#  Ce fichier decrit la base de donnees dont le projet a besoin.
#  Lancer :  docker compose up -d      (demarre la base en arriere-plan)
#  Arreter :  docker compose down      (garde les donnees)
#             docker compose down -v   (SUPPRIME les donnees : repart de zero)
# =============================================================================
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tvfed_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tvfed}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD dans le .env}
      POSTGRES_DB: ${DB_NAME:-tvfed}
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/sql/create_tables.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tvfed} -d ${DB_NAME:-tvfed}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: tvfed_ml
    depends_on:
      - db
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
    volumes:
      - .:/app


  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: tvfed_streamlit
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
    ports:
      - "8501:8501"
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  pgdata:
